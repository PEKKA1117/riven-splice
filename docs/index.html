<body>
<title>Riven Splice Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column — riven setup → recipe picker → trait/trait/spliced cards → roll map → tables.
   Riven violet is the accent; trait 1 / trait 2 / spliced each own one series color everywhere. */
:root {
  --ground: #F2F1F9; --raised: #FFFFFF; --sunk: #E6E4F3;
  --ink: #14121F; --ink2: #4D4A63; --ink3: #67637E;
  --rule: #D3D0E6; --rule2: #BBB7D4;
  --accent: #6E4BC4; --accent-soft: #E9E3FA;
  --s1: #1C6FB5; --s2: #B4661B; --s3: #6E4BC4;
  --bad: #B3261E; --bad-soft: #FBE9E7;
  --f-display: "Chakra Petch", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Noto Sans Mono", "Noto Sans Mono CJK TC", "Noto Sans TC", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #100E19; --raised: #18152A; --sunk: #0B0A13;
    --ink: #E2DFF0; --ink2: #A09BB8; --ink3: #847F9D;
    --rule: #262238; --rule2: #353049;
    --accent: #9F85E8; --accent-soft: #2A2245;
    --s1: #4A93D6; --s2: #C4842F; --s3: #9F85E8;
    --bad: #F2867C; --bad-soft: #3A1C1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #100E19; --raised: #18152A; --sunk: #0B0A13;
  --ink: #E2DFF0; --ink2: #A09BB8; --ink3: #847F9D;
  --rule: #262238; --rule2: #353049;
  --accent: #9F85E8; --accent-soft: #2A2245;
  --s1: #4A93D6; --s2: #C4842F; --s3: #9F85E8;
  --bad: #F2867C; --bad-soft: #3A1C1C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; }
h2 { font-size: 19px; }
p { margin: 0; }
.num, input, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 標頭 */
.top { display: flex; gap: 20px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.top .intro { display: grid; gap: 8px; max-width: 68ch; min-width: 0; }
.lang { display: inline-flex; border: 1px solid var(--rule2); border-radius: 6px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--raised); }

/* 區塊 */
.sec { display: grid; gap: 14px; }
.sec-head { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }

/* 紫卡設定列 */
.setup { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr) minmax(0, 2fr); gap: 12px; align-items: end;
  background: var(--raised); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; }
input[type="text"], input[type="number"], select {
  width: 100%; min-width: 0; height: 38px; padding: 0 10px; font-size: 15px;
  background: var(--ground); color: var(--ink); border: 1px solid var(--rule2); border-radius: 6px;
}
select { font-family: var(--f-body); }
.hint { font-size: 12px; color: var(--ink3); min-height: 1.4em; }
.seg { display: flex; border: 1px solid var(--rule2); border-radius: 6px; overflow: hidden; height: 38px; }
.seg button { flex: 1; border: 0; border-left: 1px solid var(--rule2); background: var(--ground); font-family: var(--f-mono); font-size: 13px; padding: 0 6px; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--raised); }
.seg button:disabled { color: var(--ink3); cursor: not-allowed; background: var(--sunk); }

/* 分頁 */
.stack { display: grid; gap: 28px; }
.stack[hidden] { display: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule2); overflow-x: auto; }
.tab { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; padding: 10px 16px;
  font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--ink2); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tbl td.uses { white-space: normal; color: var(--ink2); font-size: 13px; min-width: 9em; }
.tbl td.b { color: var(--ink3); font-size: 12.5px; }
.tbl th.b { text-transform: none; }
.tbl td.pin, .tbl th.pin { width: 1%; padding-right: 2px; }
.tbl td.pin input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
.tbl tr.pinned td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tbl tr.pin-end td { border-bottom: 1px solid var(--rule2); }

/* 配方晶片 */
.groups { display: grid; gap: 12px; }
.group { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: start; }
.group > .lbl { font-family: var(--f-display); font-weight: 600; font-size: 13px; color: var(--ink2); padding-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: grid; gap: 1px; text-align: left; padding: 6px 11px; border: 1px solid var(--rule2); border-radius: 6px; background: var(--raised); }
.chip b { font-weight: 600; font-size: 14px; }
.chip span { font-size: 12px; color: var(--ink3); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

/* 計算卡 */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr) 28px minmax(0, 1.15fr); align-items: stretch; }
.op { display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--ink3); }
.card { background: var(--raised); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card .name { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 16px; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.s1 { background: var(--s1); } .sw.s2 { background: var(--s2); } .sw.s3 { background: var(--s3); }
.card .seg { height: 32px; }
.card .seg button { font-family: var(--f-body); }
.inrow { position: relative; }
.inrow input { height: 46px; font-size: 22px; padding-right: 44px; }
.inrow .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink3); font-family: var(--f-mono); pointer-events: none; }
.range { font-size: 13px; color: var(--ink2); }
.roll { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--sunk); min-height: 2.6em; }
.roll.err { background: var(--bad-soft); color: var(--bad); }
.roll.win { box-shadow: inset 3px 0 0 var(--s3); }
.card.out { border-color: var(--s3); box-shadow: 0 0 0 1px var(--s3); }
.big { font-family: var(--f-mono); font-weight: 500; font-size: clamp(34px, 5vw, 46px); line-height: 1.05; color: var(--s3); font-variant-numeric: tabular-nums; }
.big small { font-size: .45em; color: var(--ink2); }

/* 擲值地圖 */
.panel { background: var(--raised); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.target { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.target .inrow { width: 150px; }
.target .inrow input { height: 38px; font-size: 16px; }
.target-out { font-size: 14px; }
.target-out b { font-family: var(--f-mono); font-weight: 500; }
.scroll { overflow-x: auto; }
#nomo { display: block; width: 100%; min-width: 640px; height: auto; touch-action: pan-y; }
#nomo text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink2); paint-order: stroke; stroke: var(--raised); stroke-width: 4px; stroke-linejoin: round; }
#nomo .lab { font-family: var(--f-body); font-size: 12.5px; font-weight: 600; fill: var(--ink); }
#nomo .sub { font-family: var(--f-body); font-size: 11px; fill: var(--ink3); }
#nomo .base { stroke: var(--rule2); stroke-width: 1; fill: none; }
#nomo .band1 { stroke: var(--s1); } #nomo .band2 { stroke: var(--s2); } #nomo .band3 { stroke: var(--s3); }
#nomo .band { stroke-width: 6; stroke-linecap: round; opacity: .28; fill: none; }
#nomo .tick { stroke: var(--rule2); fill: none; }
#nomo .grid { stroke: var(--rule); stroke-dasharray: 2 4; fill: none; }
#nomo .cur { stroke: var(--s3); stroke-width: 1.5; fill: none; }
#nomo .ghost { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
#nomo .d1 { fill: var(--s1); } #nomo .d2 { fill: var(--s2); } #nomo .d3 { fill: var(--s3); }
#nomo .ring { fill: var(--raised); stroke-width: 2; }
#nomo .ring.d1 { stroke: var(--s1); } #nomo .ring.d2 { stroke: var(--s2); } #nomo .ring.d3 { stroke: var(--s3); }
#nomo .val { font-weight: 500; fill: var(--ink); }
#nomo .gval { fill: var(--ink2); }
#nomo .hit { fill: transparent; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* 表格 */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--rule2); white-space: nowrap; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; }
.tbl tr.hl td { background: var(--accent-soft); }
.tbl tr.na td { color: var(--ink3); }
.tbl .pick { border: 0; background: none; padding: 0; text-align: left; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.tbl tr.sel td { background: var(--accent-soft); }
.c1 { color: var(--s1); } .c2 { color: var(--s2); } .c3 { color: var(--s3); }
.notes { font-size: 13px; color: var(--ink2); display: grid; gap: 6px; max-width: 80ch; }
.notes code { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
footer.notes { border-top: 1px solid var(--rule); padding-top: 18px; }
a { color: var(--accent); }

@media (max-width: 900px) {
  .setup { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .setup .f-layout { grid-column: 1 / -1; }
  .calc { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .op { height: 30px; }
}
@media (max-width: 520px) {
  .group { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .group > .lbl { padding-top: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .seg button, .lang button { transition: background-color .12s, border-color .12s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="intro">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p class="muted" data-t="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="en">EN</button>
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
    </div>
  </header>

  <section class="sec">
    <div class="sec-head"><h2 data-t="h-riven"></h2><span class="small muted" data-t="h-riven-sub"></span></div>
    <div class="setup">
      <div class="field">
        <label for="rtype" data-t="rtype"></label>
        <select id="rtype"></select>
        <div class="hint" data-t="disp-hint"></div>
      </div>
      <div class="field">
        <label for="lvl" data-t="rank"></label>
        <select id="lvl"></select>
        <div class="hint"></div>
      </div>
      <div class="field f-layout">
        <span class="lbl" id="layout-lbl" data-t="layout"></span>
        <div class="seg" role="group" aria-labelledby="layout-lbl" id="layout"></div>
        <div class="hint" id="layout-hint"></div>
      </div>
    </div>
  </section>

  <div class="tabs" role="tablist" aria-label="View">
    <button type="button" class="tab" role="tab" id="tab-splice" data-tab="splice" aria-controls="panel-splice" data-t="tab-splice"></button>
    <button type="button" class="tab" role="tab" id="tab-ranges" data-tab="ranges" aria-controls="panel-ranges" data-t="tab-ranges"></button>
  </div>

  <div class="stack" id="panel-splice" role="tabpanel" aria-labelledby="tab-splice">
  <section class="sec">
    <div class="sec-head"><h2 data-t="h-recipe"></h2><span class="small muted" id="recipe-count"></span></div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2 data-t="h-calc"></h2><span class="small muted" data-t="h-calc-sub"></span></div>
    <div class="calc">
      <div class="card" id="card0">
        <div class="name"><span class="sw s1"></span><span id="t0-name"></span></div>
        <div class="seg" role="group" id="t0-role"></div>
        <div class="inrow"><input type="text" id="t0-val" inputmode="decimal" autocomplete="off"><span class="unit" id="t0-unit"></span></div>
        <div class="range" id="t0-range"></div>
        <div class="roll" id="t0-roll"></div>
      </div>
      <div class="op" aria-hidden="true">+</div>
      <div class="card" id="card1">
        <div class="name"><span class="sw s2"></span><span id="t1-name"></span></div>
        <div class="seg" role="group" id="t1-role"></div>
        <div class="inrow"><input type="text" id="t1-val" inputmode="decimal" autocomplete="off"><span class="unit" id="t1-unit"></span></div>
        <div class="range" id="t1-range"></div>
        <div class="roll" id="t1-roll"></div>
      </div>
      <div class="op" aria-hidden="true">→</div>
      <div class="card out">
        <div class="name"><span class="sw s3"></span><span id="out-name"></span></div>
        <div class="big" id="out-big"></div>
        <div class="small" id="out-why"></div>
        <div class="range" id="out-range"></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2 data-t="h-map"></h2><span class="small muted" data-t="h-map-sub"></span></div>
    <div class="panel">
      <div class="target">
        <label for="target" class="small" style="font-weight:600" data-t="target"></label>
        <div class="inrow"><input type="text" id="target" inputmode="decimal" autocomplete="off"><span class="unit" id="target-unit"></span></div>
        <div class="target-out" id="target-out"></div>
      </div>
      <div class="scroll"><svg id="nomo" viewBox="0 0 760 250" role="img" aria-labelledby="nomo-desc"><desc id="nomo-desc"></desc></svg></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2 data-t="h-reach"></h2><span class="small muted" data-t="h-reach-sub"></span></div>
    <div class="panel"><div class="scroll"><table class="tbl" id="reach"></table></div>
      <p class="notes" data-t="reach-note"></p></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2 data-t="h-all"></h2><span class="small muted" data-t="h-all-sub"></span></div>
    <div class="panel"><div class="scroll"><table class="tbl" id="all"></table></div></div>
  </section>

  </div>

  <div class="stack" id="panel-ranges" role="tabpanel" aria-labelledby="tab-ranges" hidden>
  <section class="sec">
    <div class="sec-head"><h2 data-t="h-ranges"></h2><span class="small muted" id="ranges-sub"></span></div>
    <div class="panel"><div class="scroll"><table class="tbl" id="ranges"></table></div>
      <div class="notes" data-t="ranges-note"></div></div>
  </section>
  </div>

  <footer class="notes" id="foot"></footer>
</div>

<script>
// ===== 資料 =====
// 紫卡類型；col = 拼接屬性基礎係數表的欄（步槍/霰彈/手槍(含 kitgun)/Archgun/近戰(含 zaw)）
const RIVEN_TYPES = [
  { id: "LotusRifleRandomModRare",         en: "Rifle",   zh: "步槍",       col: 0 },
  { id: "LotusShotgunRandomModRare",       en: "Shotgun", zh: "霰彈槍",     col: 1 },
  { id: "LotusPistolRandomModRare",        en: "Pistol",  zh: "手槍",       col: 2 },
  { id: "LotusModularPistolRandomModRare", en: "Kitgun",  zh: "組合槍",     col: 2 },
  { id: "LotusArchgunRandomModRare",       en: "Archgun", zh: "空戰武器",   col: 3 },
  { id: "PlayerMeleeWeaponRandomModRare",  en: "Melee",   zh: "近戰",       col: 4 },
  { id: "LotusModularMeleeRandomModRare",  en: "Zaw",     zh: "Zaw",       col: 4 },
];

// 一般屬性基礎係數 b（ExportUpgrades.json），依 RIVEN_TYPES 順序；null = 該類型不會出現
const _5 = (v) => [v, v, v, v, v, null, null];
const _M = (v) => [null, null, null, null, null, v, v];
const BASE = {
  WeaponClipMaxMod:              [0.005555, 0.005555, 0.005555, 0.005555, 0.0067, null, null],
  WeaponReloadSpeedMod:          [0.005555, 0.005555, 0.005555, 0.005555, 0.0111, null, null],
  WeaponRecoilReductionMod:      _5(-0.01),
  WeaponAmmoMaxMod:              [0.00555, 0.01, 0.01, 0.01, 0.0111, null, null],
  WeaponFireDamageMod:           [0.01, 0.01, 0.01, 0.01, 0.0133, 0.01, 0.01],
  WeaponFreezeDamageMod:         [0.01, 0.01, 0.01, 0.01, 0.0133, 0.01, 0.01],
  WeaponToxinDamageMod:          [0.01, 0.01, 0.01, 0.01, 0.0133, 0.01, 0.01],
  WeaponElectricityDamageMod:    [0.01, 0.01, 0.01, 0.01, 0.0133, 0.01, 0.01],
  WeaponFactionDamageCorpus:     _5(0.005),
  WeaponFactionDamageGrineer:    _5(0.005),
  WeaponFactionDamageInfested:   [0.005, 0.005, 0.005, 0.005, null, null, null],
  WeaponMeleeFactionDamageCorpus:   _M(0.005),
  WeaponMeleeFactionDamageGrineer:  _M(0.005),
  WeaponMeleeFactionDamageInfested: _M(0.005),
  WeaponMeleeComboEfficiencyMod: _M(0.00816),
  ComboDurationMod:              _M(0.09),

    const lab = fmt(c.outUnit, val(c.outSc, wOf(c.u)), true);
    const anchor = c.u > 0.85 ? "end" : c.u < 0.15 ? "start" : "middle";
    svg.appendChild(el("text", { x, y: NOMO.rows[2] + 34, "text-anchor": anchor, class: "val" }, lab));
  }
  if (need != null && need > 0 && need <= 1) {
    const x = xOf(need);
    under.appendChild(el("line", { x1: x, x2: x, y1: NOMO.rows[0] - 10, y2: NOMO.rows[2] + 6, class: "ghost" }));
  }
  // 滑鼠/手指讀值
  const g = el("g", { id: "ghost" });
  svg.appendChild(g);
  const hit = el("rect", { x: NOMO.L - 10, y: 10, width: NOMO.R - NOMO.L + 20, height: 230, class: "hit" });
  svg.appendChild(hit);
  lastC = { c, rows };
  drawGhost();
}
function drawGhost() {
  const g = $("ghost");
  if (!g || !lastC) return;
  g.replaceChildren();
  if (ghostU == null) return;
  const x = xOf(ghostU), { rows } = lastC;
  g.appendChild(el("line", { x1: x, x2: x, y1: 26, y2: NOMO.rows[2] + 6, class: "ghost" }));
  g.appendChild(el("text", { x, y: 52, "text-anchor": ghostU > 0.85 ? "end" : ghostU < 0.15 ? "start" : "middle", class: "gval" }, "×" + wOf(ghostU).toFixed(3)));
  for (const row of rows) {
    g.appendChild(el("circle", { cx: x, cy: row.y, r: 4, class: `d${row.cls}` }));
    const t = el("text", { x: x + (ghostU > 0.85 ? -8 : 8), y: row.y - 9, "text-anchor": ghostU > 0.85 ? "end" : "start", class: "val" },
      fmt(row.unit, val(row.sc, wOf(ghostU)), true));
    g.appendChild(t);
  }
}
function nomoPointer(ev) {
  const svg = $("nomo"), r = svg.getBoundingClientRect();
  const vx = ((ev.clientX - r.left) / r.width) * 760;
  ghostU = Math.min(1, Math.max(0, (vx - NOMO.L) / (NOMO.R - NOMO.L)));
  drawGhost();
}

function renderLegend() {
  $("legend").innerHTML = `<span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="var(--raised)" stroke="var(--ink2)" stroke-width="2"/></svg>${tr("lg-in")}</span>`
    + `<span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="var(--s3)"/></svg>${tr("lg-cur")}</span>`
    + `<span><svg width="22" height="14" aria-hidden="true"><line x1="1" x2="21" y1="7" y2="7" stroke="var(--ink3)" stroke-dasharray="4 3"/></svg>${tr("target")}</span>`;
}

function renderReach(c) {
  const [x, y] = c.traits, u = c.outUnit;
  const near = c.win >= 0 ? REACH_W.reduce((best, w, i) => (Math.abs(w - wOf(c.u)) < Math.abs(REACH_W[best] - wOf(c.u)) ? i : best), 0) : -1;
  const head = `<thead><tr><th class="num">${tr("roll")}</th><th class="num c1">${nm(TRAITS[x.tag])} <span class="muted">(${tr(x.role)})</span></th><th class="num c2">${nm(TRAITS[y.tag])} <span class="muted">(${tr(y.role)})</span></th><th class="num c3">${nm(SPLICED[c.r.out])}</th></tr></thead>`;
  const body = REACH_W.map((w, i) => `<tr class="${i === near ? "hl" : ""}"><td class="num">×${w.toFixed(2)}</td><td class="num">${fmt(x.unit, val(x.sc, w), true)}</td><td class="num">${fmt(y.unit, val(y.sc, w), true)}</td><td class="num"><b>${fmt(u, val(c.outSc, w), true)}</b></td></tr>`).join("");
  $("reach").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderAll(c) {
  const s = state, t = s.type;
  const head = `<thead><tr><th>${tr("spliced")}</th><th>${tr("from")}</th><th class="num">${lang === "zh" ? "屬性一" : "Trait 1"}</th><th class="num">${lang === "zh" ? "屬性二" : "Trait 2"}</th><th class="num">${tr("spliced")}</th></tr></thead>`;
  const rows = RECIPES.map((r) => {
    const why = recipeBlock(r, t);
    const out = nm(SPLICED[r.out]);
    if (why) return { na: true, html: `<tr class="na"><td>${out}</td><td colspan="4">${why}</td></tr>` };
    const [a, b] = recipeTags(r, t);
    const ra = (tag) => { const sc = buffScale(BASE[tag][t], s), un = TRAITS[tag].unit; return `${fmt(un, val(sc, 0.9), true)} – ${fmt(un, val(sc, 1.1), true)}`; };
    const osc = splicedScale(r.out, s), ou = SPLICED[r.out].unit;
    return { html: `<tr class="${r.id === c.r.id ? "sel" : ""}"><td><button type="button" class="pick" data-r="${r.id}">${out}</button></td><td>${nm(TRAITS[a])} + ${nm(TRAITS[b])}</td><td class="num">${ra(a)}</td><td class="num">${ra(b)}</td><td class="num"><b>${fmt(ou, val(osc, 0.9), true)} – ${fmt(ou, val(osc, 1.1), true)}</b></td></tr>` };
  });
  $("all").innerHTML = head + "<tbody>" + rows.filter((r) => !r.na).map((r) => r.html).join("") + rows.filter((r) => r.na).map((r) => r.html).join("") + "</tbody>";
}

// 屬性範圍表的列順序：傷害 → 暴擊 → 元素 → 物理 → 派系 → 彈藥與操控 → 近戰專屬
const RANGE_ORDER = [
  "WeaponDamageAmountMod", "WeaponMeleeDamageMod", "WeaponFireIterationsMod", "WeaponFireRateMod",
  "WeaponCritChanceMod", "WeaponCritDamageMod", "SlideAttackCritChanceMod",
  "WeaponStunChanceMod", "WeaponProcTimeMod",
  "WeaponFireDamageMod", "WeaponFreezeDamageMod", "WeaponToxinDamageMod", "WeaponElectricityDamageMod",
  "WeaponImpactDamageMod", "WeaponArmorPiercingDamageMod", "WeaponSlashDamageMod",
  "WeaponFactionDamageCorpus", "WeaponFactionDamageGrineer", "WeaponFactionDamageInfested",
  "WeaponMeleeFactionDamageCorpus", "WeaponMeleeFactionDamageGrineer", "WeaponMeleeFactionDamageInfested",
  "WeaponClipMaxMod", "WeaponReloadSpeedMod", "WeaponAmmoMaxMod", "WeaponRecoilReductionMod",
  "WeaponZoomFovMod", "WeaponProjectileSpeedMod", "WeaponPunctureDepthMod",
  "WeaponMeleeRangeIncMod", "WeaponMeleeFinisherDamageMod", "WeaponMeleeComboEfficiencyMod",
  "ComboDurationMod", "WeaponMeleeComboInitialBonusMod", "WeaponMeleeComboBonusOnHitMod", "WeaponMeleeComboPointsOnHitMod",
];
// 數值相同時合併成一列的屬性群組；short = 合併列括號內的簡稱
const MERGE = [
  { key: "elem", en: "Elemental damage", zh: "元素傷害", short: {
      WeaponFireDamageMod: ["Heat", "火焰"], WeaponFreezeDamageMod: ["Cold", "冰凍"],
      WeaponToxinDamageMod: ["Toxin", "毒素"], WeaponElectricityDamageMod: ["Electricity", "電擊"] } },
  { key: "phys", en: "Physical damage", zh: "物理傷害", short: {
      WeaponImpactDamageMod: ["Impact", "衝擊"], WeaponArmorPiercingDamageMod: ["Puncture", "穿刺"],
      WeaponSlashDamageMod: ["Slash", "切割"] } },
  { key: "fac", en: "Faction damage", zh: "派系傷害", short: {
      WeaponFactionDamageCorpus: ["Corpus", "Corpus"], WeaponFactionDamageGrineer: ["Grineer", "Grineer"],
      WeaponFactionDamageInfested: ["Infested", "Infested"],
      WeaponMeleeFactionDamageCorpus: ["Corpus", "Corpus"], WeaponMeleeFactionDamageGrineer: ["Grineer", "Grineer"],
      WeaponMeleeFactionDamageInfested: ["Infested", "Infested"] } },
];
// 部分屬性在遠程與近戰的名稱不同
function traitName(tag, t) {
  if (tag === "WeaponFireRateMod" && !isMelee(t)) return lang === "zh" ? "射速（弓類加倍）" : "Fire Rate (x2 for Bows)";
  if (tag === "WeaponCritChanceMod" && isMelee(t)) return lang === "zh" ? "暴擊機率（重擊 x 2）" : "Critical Chance (x2 for Heavy Attacks)";
  return nm(TRAITS[tag]);
}
function renderRanges(c) {
  const s = state, t = s.type;
  const uses = {};  // tag → Map(拼接屬性 → 用到這條屬性的配方 id)
  for (const r of RECIPES) {
    if (recipeBlock(r, t)) continue;
    for (const tag of recipeTags(r, t)) {
      const m = (uses[tag] ??= new Map());
      if (!m.has(r.out)) m.set(r.out, r.id);
    }
  }
  // 組列：同群組且 b 相同的屬性併成一列，key 用群組名，否則用 tag
  const present = RANGE_ORDER.filter((tag) => BASE[tag][t] != null);
  const items = [], done = new Set();
  for (const tag of present) {
    if (done.has(tag)) continue;
    const g = MERGE.find((m) => tag in m.short);
    // 遠程的穿刺係數是 0.01333、衝擊與切割是 0.013333，差距 0.1% 內視為同值
    const close = (a, b) => Math.abs(a - b) <= 1e-3 * Math.abs(b);
    const mates = g ? present.filter((x) => x in g.short && close(BASE[x][t], BASE[tag][t])) : [tag];
    mates.forEach((x) => done.add(x));
    const sep = lang === "zh" ? "／" : " / ";
    const name = mates.length > 1
      ? `${nm(g)}（${mates.map((x) => g.short[x][lang === "zh" ? 1 : 0]).join(sep)}）`
      : traitName(tag, t);
    items.push({ key: mates.length > 1 ? g.key : tag, tag, tags: mates, name });
  }
  const pins = new Set(s.pins);
  const ordered = [...items.filter((x) => pins.has(x.key)), ...items.filter((x) => !pins.has(x.key))];
  const nPinned = ordered.filter((x) => pins.has(x.key)).length;

  const pick = new Set(c.traits.map((x) => x.tag));
  // 合併列的係數若不完全相同，範圍取最寬：下限用最小係數、上限用最大係數
  const range = (tag, scs) => {
    const m = TRAITS[tag], sign = m.neg ? -1 : 1;
    const byMag = [...scs].sort((a, b) => Math.abs(a) - Math.abs(b));
    return `${fmt(m.unit, sign * val(byMag[0], 0.9), true)} – ${fmt(m.unit, sign * val(byMag.at(-1), 1.1), true)}`;
  };
  const dash = `<span class="muted">—</span>`;
  const rows = ordered.map((it, i) => {
    const { tag } = it, m = TRAITS[tag], bs = it.tags.map((x) => BASE[x][t]);
    const buff = m.curseOnly ? dash : range(tag, bs.map((b) => buffScale(b, s)));
    const curse = m.pos ? dash : s.curses === 0 ? `<span class="muted">${tr("no-curse")}</span>` : range(tag, bs.map((b) => curseScale(b, s)));
    const b = [...new Set(bs)].join(" / ");
    const outs = new Map();
    for (const x of it.tags) for (const [out, id] of uses[x] ?? []) if (!outs.has(out)) outs.set(out, id);
    const to = [...outs].map(([out, id]) =>
      `<button type="button" class="pick" data-r="${id}">${nm(SPLICED[out])}</button>`).join(lang === "zh" ? "、" : ", ");
    const on = pins.has(it.key);
    const cls = [it.tags.some((x) => pick.has(x)) ? "sel" : "", on ? "pinned" : "", on && i === nPinned - 1 ? "pin-end" : ""].join(" ").trim();
    return `<tr class="${cls}"><td class="pin"><input type="checkbox" class="pinbox" data-k="${it.key}" aria-label="${tr("pin-label", it.name)}"${on ? " checked" : ""}></td><td>${it.name}</td><td class="num">${buff}</td><td class="num">${curse}</td><td class="uses">${to}</td><td class="num b">${b}</td></tr>`;
  });
  $("ranges").innerHTML = `<thead><tr><th class="pin">${tr("pin")}</th><th>${tr("attr")}</th><th class="num">${tr("buff-r")}</th><th class="num">${tr("curse-r")}</th><th>${tr("splice-to")}</th><th class="num b">${tr("b-col")}</th></tr></thead><tbody>${rows.join("")}</tbody>`;
  $("ranges-sub").textContent = tr("ranges-sub", nm(RIVEN_TYPES[t]), `${s.lvl} · ${layoutKey(s)}`);
}
function showTab() {
  if (state.tab !== "ranges") state.tab = "splice";
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
  $("panel-splice").hidden = state.tab !== "splice";
  $("panel-ranges").hidden = state.tab !== "ranges";
}

function render() {
  renderSetup();
  renderChips();
  const r = currentRecipe();
  fixRoles(recipeTags(r, state.type));
  if (state.example) setExampleValues(r);  // 範例值跟著設定變動，才不會超出範圍
  const c = compute();
  renderCalc(c);
  const need = renderTarget(c);
  renderNomo(c, need);
  renderReach(c);
  renderAll(c);
  renderRanges(c);
  showTab();
  save();
}

// ===== 事件 =====
function selectRecipe(id) {
  if (id === state.recipe) return;
  state.recipe = id;
  state.roles = ["buff", "buff"];
  state.target = "";
  setExampleValues(currentRecipe());
  state.example = true;
  render();
}
function init() {
  const had = load();
  try { const l = localStorage.getItem(LANG_KEY); if (l === "en" || l === "zh") lang = l; } catch (e) { /* 忽略 */ }
  if (!had) setExampleValues(currentRecipe());
  if (location.hash === "#ranges") state.tab = "ranges";
  applyI18n();
  renderLegend();
  render();

  $("lang-en").onclick = $("lang-zh").onclick = (e) => {
    lang = e.currentTarget.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* 忽略 */ }
    applyI18n(); renderLegend(); render();
  };
  $("rtype").onchange = (e) => { state.type = +e.target.value; render(); };
  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab"); if (!b) return;
    state.tab = b.dataset.tab; showTab(); save();
  });
  // 置頂勾選：重繪後把焦點放回同一個方塊，鍵盤操作才不會跳走
  $("ranges").addEventListener("change", (e) => {
    const box = e.target.closest(".pinbox"); if (!box) return;
    const k = box.dataset.k;
    state.pins = box.checked ? [...state.pins.filter((x) => x !== k), k] : state.pins.filter((x) => x !== k);
    renderRanges(compute()); save();
    $("ranges").querySelector(`.pinbox[data-k="${k}"]`)?.focus();
  });
  // 屬性範圍表的拼接屬性連結：切回拼接計算並選好配方
  $("ranges").addEventListener("click", (e) => {
    const b = e.target.closest(".pick"); if (!b) return;
    state.tab = "splice";
    selectRecipe(b.dataset.r);
    showTab(); save();
    $("groups").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    state.tab = state.tab === "splice" ? "ranges" : "splice"; showTab(); save();
    $(`tab-${state.tab}`).focus();
  });
  $("lvl").onchange = (e) => { state.lvl = +e.target.value; render(); };
  $("layout").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.buffs = +b.dataset.b; state.curses = +b.dataset.c; render();
  });
  $("groups").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) selectRecipe(b.dataset.r); });
  $("all").addEventListener("click", (e) => {
    const b = e.target.closest(".pick"); if (!b) return;
    selectRecipe(b.dataset.r);
    $("groups").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  for (const i of [0, 1]) {
    $(`t${i}-role`).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b || b.disabled) return;
      state.roles[i] = b.dataset.role;
      if (b.dataset.role === "curse") state.roles[1 - i] = "buff";
      if (state.example) setExampleValues(currentRecipe());
      render();
    });
    $(`t${i}-val`).addEventListener("input", (e) => { state.vals[i] = e.target.value; state.example = false; render(); });
  }
  $("target").addEventListener("input", (e) => { state.target = e.target.value; render(); });
  const svg = $("nomo");
  svg.addEventListener("pointermove", nomoPointer);
  svg.addEventListener("pointerdown", nomoPointer);
  svg.addEventListener("pointerleave", () => { ghostU = null; drawGhost(); });
}
init();
</script>
</body>
</html>
